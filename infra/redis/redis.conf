# ==============================================================================
# Configuración Redis 7 - Broker de Colas, Deduplicación SETNX y Caché (C4 Nivel 2)
# Sistema Transaccional de Respuesta Rápida para Empadronamiento en Emergencias
# Trazabilidad: ADR-003, DA01, AC01 (Rendimiento), AC03 (Deduplicación O(1)), AC04 (0 jobs perdidos)
# ==============================================================================

# Red y Seguridad Local (Sin Docker)
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 2048
timeout 0
tcp-keepalive 300

# Bases de datos lógicas:
# DB 0 -> Broker de Laravel Queues (cola 'empadronamiento') y llaves SETNX ('dni:<DNI>')
# DB 1 -> Caché de reportes estadísticos ('reportes:metricas_por_zona') y sesiones
databases 16

# ------------------------------------------------------------------------------
# Persistencia AOF (Append Only File) - Garantiza 0 pérdida de jobs encolados (AC04)
# ------------------------------------------------------------------------------
appendonly yes
appendfilename "empadronamiento-appendonly.aof"
appenddirname "appendonlydir"

# Sincronización a disco cada segundo: equilibrio óptimo entre alto throughput
# (ráfagas de 2,000 a 3,000 brigadistas) y durabilidad ante caídas (máx. 1 s de ventana)
appendfsync everysec

no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Respaldo complementario RDB
save 900 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename "empadronamiento-dump.rdb"

# ------------------------------------------------------------------------------
# Gestión de Memoria y Alta Concurrencia
# ------------------------------------------------------------------------------
maxclients 10000
maxmemory 512mb

# noeviction protege los jobs de la cola 'empadronamiento' y los bloqueos SETNX 'dni:*'
# evitando que Redis elimine registros encolados durante un pico de emergencia
maxmemory-policy noeviction

# Liberación asíncrona de memoria para no bloquear el hilo principal
lazyfree-lazy-eviction no
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Monitoreo de latencia para auditoría de desempeño (umbral: 10 ms)
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 10

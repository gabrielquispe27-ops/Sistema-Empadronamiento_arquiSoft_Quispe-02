# ==============================================================================
# Configuración Nginx - Balanceador de Carga y Reverse Proxy (Modelo C4 Nivel 2)
# Sistema Transaccional de Respuesta Rápida para Empadronamiento en Emergencias
# Trazabilidad: ADR-001, DA01 (Alta concurrencia: 2,000 - 3,000 usuarios), AC01, AC04
# ==============================================================================

# Pool de 3 instancias locales stateless del Monolito Modular Laravel 11
upstream laravel_empadronamiento_cluster {
    least_conn;

    server 127.0.0.1:8001 max_fails=3 fail_timeout=15s weight=1;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=15s weight=1;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=15s weight=1;

    # Conexiones persistentes hacia los backends para reducir latencia TCP en picos
    keepalive 64;
}

server {
    listen 80;
    server_name localhost empadronamiento.local;

    # Optimización para ráfagas de peticiones móviles en campo (AC01 < 2 s)
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    send_timeout 15s;

    # Compresión Gzip para respuestas JSON y vistas SSR Mobile-First en redes 3G/4G inestables
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # Endpoint de verificación de salud del balanceador
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","node":"nginx-lb"}';
        add_header Content-Type application/json;
    }

    # Proxy inverso hacia las 3 instancias stateless de Laravel
    location / {
        proxy_pass http://laravel_empadronamiento_cluster;
        proxy_http_version 1.1;

        # Reutilización de conexiones keepalive con el upstream
        proxy_set_header Connection "";

        # Cabeceras estándar de Reverse Proxy para trazabilidad y Laravel Sanctum
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts y failover automático entre las 3 réplicas locales (AC04 - Disponibilidad 99.5%)
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Buffers optimizados para payloads de captura y reportes JSON/SSR
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
